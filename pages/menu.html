<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu | PRIM'ERA Café</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/menu.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="../index.html">
        <img src="../assets/logo.png" alt="PRIM'ERA Café logo" />
        <span>PRIM'ERA Café</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="menu.html" aria-current="page">Menu</a>
        <a href="reviews.html">Reviews</a>
        <a href="about.html">About</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false">menu</button>
    </header>
    <nav class="drawer" id="drawer" aria-label="Mobile navigation" aria-hidden="true">
      <a href="../index.html">Home</a>
      <a href="menu.html" aria-current="page">Menu</a>
      <a href="reviews.html">Reviews</a>
      <a href="about.html">About</a>
    </nav>

    <main>
      <section class="page active" id="menu">
        <div class="page-heading">
          <p class="eyebrow">OUR SELECTION</p>
          <h2>menu</h2>
          <p class="intro">Simple favorites made carefully, served fresh every day.</p>
        </div>

        <div class="tabs">
          <button class="tab active" data-category="coffee" type="button" aria-pressed="true">COFFEE</button>
          <button class="tab" id="pastries" data-category="pastries" type="button" aria-pressed="false">PASTRIES</button>
        </div>

        <div class="products-table-wrap">
          <table class="products-table" aria-label="PRIM'ERA Café menu products">
            <thead>
              <tr>
                <th rowspan="2">Product</th>
                <th rowspan="2">Description</th>
                <th rowspan="2">Type</th>
                <th>price</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="products"></tbody>
            <tfoot>
              <tr><td colspan="5">Prices are for informational purposes only.</td></tr>
            </tfoot>
          </table>
        </div>
      </section>

      <section class="page" id="item-detail">
        <div class="detail-wrap">
          <button class="back-btn" id="detailBack" type="button">← BACK TO MENU</button>
          <div class="detail-card">
            <div class="detail-art" id="detailArt"></div>
            <div class="detail-copy">
              <p class="eyebrow" id="detailCategory">MENU ITEM</p>
              <h2 id="detailName">Café Latte</h2>
              <p id="detailDescription"></p>
              <strong class="detail-price" id="detailPrice">₱135</strong>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="../js/site.js"></script>
    <script src="../js/menu.js"></script>
  </body>
</html>
